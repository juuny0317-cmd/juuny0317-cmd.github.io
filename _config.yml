# Basic site settings
locale: "en-US"
site_theme: "default"
title: "YongJun"
title_separator: "—"
name: &name "YongJun"
description: &description "Academic portfolio focused on autonomous driving, robotics, and real-world systems."
url: "https://juuny0317-cmd.github.io"
baseurl: ""
repository: "juuny0317-cmd/juuny0317-cmd.github.io"

# Sidebar profile
author:
  avatar: "profile-placeholder.svg"
  name: "YongJun"
  bio: "스마트운행체공학과 2학년"
  location: "건국대학교"
  employer:
  uri:
  email: "yongjunyu0317@gmail.com"
  phone: "010-8341-8583"
  phone_href: "+821083418583"
  github: "juuny0317-cmd"

# Site behavior
breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"
talkmap_link: false
comments:
  provider:
atom_feed:
  hide: true

# SEO and social sharing
google_site_verification:
bing_site_verification:
alexa_site_verification:
yandex_site_verification:
twitter:
  username:
facebook:
  username:
  app_id:
  publisher:
social:
  type: "Person"
  name: "YongJun"
  links:
    - "https://github.com/juuny0317-cmd"
analytics:
  provider: "false"

# Build inputs
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - node_modules
  - package-lock.json
  - README.md
  - tmp
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Markdown
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# AcademicPages collections remain available for future research activity.
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: "Asia/Seoul"

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
